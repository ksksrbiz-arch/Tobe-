[build]
  command = "npm run build"
  publish = ".next"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@neondatabase/serverless", "next-auth", "resend"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Firebase API keys are safe to expose publicly; they are meant for client-side use
  # and are restricted via Firebase Security Rules, not secrecy.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyAT3s-0lTS1EIYN92aLLbGJbzHgeDTylR0"

# GSC data shows Google indexing http://tobereadshop.com/ and
# https://tobereadshop.com/ as two separate pages (264 clicks @ pos 6.19 vs
# 26 clicks @ pos 21.16), splitting ranking authority. app/layout.tsx's
# SITE_URL / canonical tags are already correctly set to https, so the app
# code isn't the problem — Netlify was never told to force the redirect at
# the edge. This does that explicitly, independent of the dashboard
# "Force HTTPS" toggle.
[[redirects]]
  from = "http://tobereadshop.com/*"
  to = "https://tobereadshop.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.tobereadshop.com/*"
  to = "https://tobereadshop.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.tobereadshop.com/*"
  to = "https://tobereadshop.com/:splat"
  status = 301
  force = true
