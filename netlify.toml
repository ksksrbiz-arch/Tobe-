[build]
  command = "npm run build"
  publish = ".next"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@neondatabase/serverless", "next-auth", "resend"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

# GSC showed http://tobereadshop.com/ indexed and ranking *separately* from
# the canonical https://tobereadshop.com/ (449 vs 57 clicks over the last 3
# months) — the in-app canonical tag (lib/seo.ts SITE_URL) can't fix this on
# its own because Google was serving the http:// result directly, splitting
# ranking signals across two URLs. Force every non-canonical host/scheme
# combination to 301-redirect to the canonical https apex at the edge, ahead
# of the Next.js app, so crawlers only ever see one URL for a given page.
[[redirects]]
  from = "http://tobereadshop.com/*"
  to = "https://tobereadshop.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.tobereadshop.com/*"
  to = "https://tobereadshop.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.tobereadshop.com/*"
  to = "https://tobereadshop.com/:splat"
  status = 301
  force = true

[build.environment]
  # Firebase API keys are safe to expose publicly; they are meant for client-side use
  # and are restricted via Firebase Security Rules, not secrecy.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyAT3s-0lTS1EIYN92aLLbGJbzHgeDTylR0"
  # Netlify's secrets scanner flags GROQ_API_KEY's literal value inside
  # .netlify/.next/cache/turbopack/**. That's Next.js's internal build cache
  # (an .sst file), never served to visitors — GROQ_API_KEY is read only in
  # lib/server/groq.ts, a server-only module with no NEXT_PUBLIC_ prefix, so
  # it never reaches the client bundle. Omitting the cache path (not the key
  # itself) keeps scanning active for any real leak into actual output.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"
